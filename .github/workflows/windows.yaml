name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Check project files
        shell: bash
        run: |
          ls -la
          test -f CMakePresets.json
          test -d cmake
          test -f src/mc-replay-source.c

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build
        run: cmake --build --preset windows-x64 --config RelWithDebInfo --parallel

      - name: Install
        run: cmake --install build_x64 --config RelWithDebInfo --prefix "${{ github.workspace }}/release"

      - name: Show result
        shell: bash
        run: find release -type f

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: obs-multicam-replay-windows-x64
          path: release
          if-no-files-found: error
